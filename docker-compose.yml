services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: model-proxy:v2
    container_name: model-proxy
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      # Config directory is persisted + editable from the admin UI.
      - ./config:/app/config
      # .env is read-write so the UI's env editor persists to disk.
      - ./.env:/app/.env
    # Load ALL keys (provider creds, client key, log level, etc.) from the
    # mounted .env into the container's process env. This ensures Bun sees
    # them on boot without relying on its auto-dotenv behavior (which only
    # fills in unset vars and will lose to any host-shell leakage).
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:9876/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
