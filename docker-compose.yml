services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: model-proxy:v2
    container_name: model-proxy
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      # Single data volume: config store, provider/model JSON, sealed secrets.
      - ./data:/app/data
      # Legacy mounts (optional): read as fallbacks and migrated into ./data
      # on first boot. Safe to delete once migrated.
      - ./config:/app/config
      - ./.storage:/app/.storage
    # Optional: any variables set here override the UI-managed config store.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:9876/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
