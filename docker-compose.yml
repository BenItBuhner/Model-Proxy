version: '3.8'

services:
  model-proxy:
    build: .
    ports:
      - "9876:9876"
    environment:
      - HOST=0.0.0.0
      - PORT=9876
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
