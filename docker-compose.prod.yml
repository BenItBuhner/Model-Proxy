services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: model-proxy:v2
    container_name: model-proxy
    restart: always
    ports:
      - "9876:9876"
    env_file:
      - .env
    environment:
      - CLIENT_API_KEY=${CLIENT_API_KEY:?Required - set in .env}
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - model-proxy-config:/app/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9876/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-proxy-config:
